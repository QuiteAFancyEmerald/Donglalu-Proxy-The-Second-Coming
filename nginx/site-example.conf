# Example http {} site for a proxy mirror behind dlpcc-stream.conf, with the
# Node app (wisp + dlpcc wrapper) on 127.0.0.1:8080. The only changes to an
# existing site are the listen lines (443 is now owned by the stream block)
# and the /dlpcc/ location.

server {
    # Was: listen 443 ssl;
    listen 127.0.0.1:8443 ssl proxy_protocol;
    http2 on;

    server_name example.com example2.com;

    # Real client IPs arrive through PROXY protocol from the stream block.
    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;

    ssl_certificate     /etc/letsencrypt/live/$ssl_server_name/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/$ssl_server_name/privkey.pem;

    # Credentials, served by the Node app's relay.routeRequest(). It rate
    # limits per client IP itself — set the app's trust proxy so it sees the
    # visitor rather than nginx (Express: app.set("trust proxy", 1)) — and
    # keep this limit_req as a second layer, since each call mints one.
    location /dlpcc/ {
        limit_req zone=dlpcc burst=10 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
    }
}

# These go in http {} once, outside any server block.
# limit_req_zone $binary_remote_addr zone=dlpcc:10m rate=30r/m;
# map $http_upgrade $connection_upgrade { default upgrade; '' close; }
