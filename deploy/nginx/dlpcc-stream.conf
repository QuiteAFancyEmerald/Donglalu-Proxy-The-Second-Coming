# DLPCC: share port 443 between the website and the TURN relay.
#
# Include this at the TOP LEVEL of nginx.conf (next to http {}, not inside it):
#     include /etc/nginx/dlpcc-stream.conf;
# Needs the stream, stream_ssl and stream_ssl_preread modules. Debian/Ubuntu's
# "nginx" package has them; on some distros you need
#     load_module modules/ngx_stream_module.so;
#
# How it works: nginx peeks at the TLS ClientHello without decrypting it.
# Browsers always offer ALPN (h2/http1.1) for page loads; the WebRTC TURN
# client does not. So no ALPN => TURN, anything else => the website. Both use
# the same hostname and the same certificate, so every mirror works with no
# extra DNS records or certs.

stream {
    map "$ssl_preread_server_name|$ssl_preread_alpn_protocols" $dlpcc_upstream {
        # Optional: dedicated turn.* hostnames always go to the relay.
        ~^turn\.    dlpcc_turn;
        # No ALPN offered.
        ~\|$        dlpcc_turn;
        default     dlpcc_web;
    }

    upstream dlpcc_web  { server 127.0.0.1:8443; }
    upstream dlpcc_turn { server 127.0.0.1:5349; }

    # Uncomment to check what clients send when debugging routing.
    # log_format dlpcc '$remote_addr sni=$ssl_preread_server_name alpn="$ssl_preread_alpn_protocols" -> $dlpcc_upstream';
    # access_log /var/log/nginx/dlpcc-stream.log dlpcc;

    server {
        listen 443;
        listen [::]:443;
        ssl_preread on;
        proxy_pass $dlpcc_upstream;
        # Pass the real client IP on to both backends.
        proxy_protocol on;
        # Long idle timeout so quiet wisp websockets and TURN sessions survive.
        proxy_timeout 1h;
    }

    # Certificate per hostname. Default assumes certbot's layout where the cert
    # directory is named after the domain. Add lines for anything else, e.g. a
    # wildcard cert covering many mirrors.
    map $ssl_server_name $dlpcc_cert_dir {
        # ~\.example\.com$   /etc/letsencrypt/live/example.com;
        default             /etc/letsencrypt/live/$ssl_server_name;
    }

    # Terminates TLS for TURN and hands plain TURN-over-TCP to dlpcc-relay.
    server {
        listen 127.0.0.1:5349 ssl proxy_protocol;
        ssl_certificate     $dlpcc_cert_dir/fullchain.pem;
        ssl_certificate_key $dlpcc_cert_dir/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:dlpcc_turn:10m;

        proxy_pass 127.0.0.1:3478;
        proxy_timeout 1h;
    }
}
